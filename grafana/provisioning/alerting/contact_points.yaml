apiVersion: 1

contactPoints:
  - orgId: 1
    name: factory-operations-team
    receivers:
      - uid: factory-ops-default
        type: webhook
        settings:
          url: http://localhost:8080/alerts
          httpMethod: POST
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: factory-operations-team
    group_by: ['alertname', 'station_id']
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h
