[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twin"
version = "2.1.0"
description = "AI-Driven Digital Twin for Smart Factory Operations (Bosch Line 3)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary / HCL Internship"}
authors = [
    {name = "Digital Twin Engineering Team"}
]
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "paho-mqtt>=2.0.0",
    "influxdb-client>=1.40.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "torch>=2.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0"
]

[project.scripts]
twin-replay = "twin.replay.run:main"
twin-ingest = "twin.ingest.mqtt_to_influx:main"
twin-scoring = "twin.scoring.scoring_service:main"
twin-train = "twin.ai.train_all:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
